<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumbukum Email Storage</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="sidepanel-shell">
    <header class="sidepanel-header">
      <div class="brand-mark">K</div>
      <div>
        <h1>Store email</h1>
        <p id="email-context" class="email-context">Checking current tab...</p>
      </div>
    </header>

    <section id="warning-view" class="panel-card panel-warning" style="display:none;">
      <p id="warning-message">Please configure Kumbukum first.</p>
      <button id="btn-open-settings" class="btn btn-primary btn-full" type="button">Open Settings</button>
    </section>

    <section id="main-view" style="display:none;">
      <div class="actions-grid">
        <button id="btn-add-email" class="btn btn-primary btn-full" type="button">Add Email</button>
      </div>
      <div id="status" class="status" style="display:none;"></div>
    </section>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
